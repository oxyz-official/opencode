name: fork-publish
run-name: "publish ${{ inputs.version || 'dev snapshot' }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.3.0)"
        required: true
        type: string
      channel:
        description: "npm dist-tag"
        required: false
        default: "latest"
        type: choice
        options:
          - latest
          - dev
          - beta
      create_release:
        description: "Create a GitHub release with binary downloads"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - dev

permissions:
  contents: write
  packages: write

concurrency:
  group: fork-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install

      - name: Determine version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "channel=${{ inputs.channel }}" >> "$GITHUB_OUTPUT"
          else
            TIMESTAMP=$(date -u +%Y%m%d%H%M)
            echo "version=0.0.0-dev-${TIMESTAMP}" >> "$GITHUB_OUTPUT"
            echo "channel=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build CLI binaries for all platforms
        run: ./packages/opencode/script/build.ts
        env:
          OPENCODE_VERSION: ${{ steps.meta.outputs.version }}
          OPENCODE_CHANNEL: ${{ steps.meta.outputs.channel }}

      - uses: actions/upload-artifact@v4
        with:
          name: opencode-cli
          path: packages/opencode/dist
          retention-days: 3

    outputs:
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: ${{ vars.NPM_REGISTRY_URL || 'https://registry.npmjs.org' }}

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install

      - uses: actions/download-artifact@v4
        with:
          name: opencode-cli
          path: packages/opencode/dist

      - name: Publish CLI binary packages
        working-directory: packages/opencode
        run: |
          for dir in dist/opencode-*/; do
            [ -d "$dir" ] || continue
            echo "::group::$(basename "$dir")"
            ( cd "$dir" && chmod -R 755 . && bun pm pack && npm publish *.tgz --access public --tag "$CHANNEL" )
            echo "::endgroup::"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CHANNEL: ${{ needs.build.outputs.channel }}

      - name: Publish CLI wrapper package
        working-directory: packages/opencode
        run: |
          mkdir -p dist/opencode
          cp -r bin dist/opencode/bin
          cp script/postinstall.mjs dist/opencode/postinstall.mjs
          cp ../../LICENSE dist/opencode/LICENSE

          node -e "
            const fs = require('fs');
            const path = require('path');
            const deps = {};
            for (const d of fs.readdirSync('dist')) {
              if (!d.startsWith('opencode-')) continue;
              const p = path.join('dist', d, 'package.json');
              if (!fs.existsSync(p)) continue;
              const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
              deps[pkg.name] = pkg.version;
            }
            fs.writeFileSync('dist/opencode/package.json', JSON.stringify({
              name: 'opencode-ai',
              bin: { opencode: './bin/opencode' },
              scripts: { postinstall: 'bun ./postinstall.mjs || node ./postinstall.mjs' },
              version: process.env.VERSION,
              license: 'MIT',
              optionalDependencies: deps,
            }, null, 2));
          "

          cd dist/opencode && bun pm pack && npm publish *.tgz --access public --tag "$CHANNEL"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          CHANNEL: ${{ needs.build.outputs.channel }}

      - name: Build and publish SDK
        run: |
          cd packages/sdk/js
          bun run ./script/build.ts
          bun run ./script/publish.ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          OPENCODE_VERSION: ${{ needs.build.outputs.version }}
          OPENCODE_CHANNEL: ${{ needs.build.outputs.channel }}

      - name: Build and publish Plugin
        run: |
          cd packages/plugin
          bun run ./script/publish.ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          OPENCODE_VERSION: ${{ needs.build.outputs.version }}
          OPENCODE_CHANNEL: ${{ needs.build.outputs.channel }}

      - name: Create release archives
        if: inputs.create_release
        working-directory: packages/opencode
        run: |
          for dir in dist/opencode-*/; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            if echo "$name" | grep -q linux; then
              tar -czf "dist/${name}.tar.gz" -C "${dir}bin" .
            else
              ( cd "${dir}bin" && zip -r "../../${name}.zip" . )
            fi
          done

      - name: Create GitHub release
        if: inputs.create_release
        run: |
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes \
            packages/opencode/dist/*.tar.gz \
            packages/opencode/dist/*.zip
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
