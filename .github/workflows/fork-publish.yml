name: fork-publish
run-name: "publish ${{ inputs.version || 'dev snapshot' }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.3.0)"
        required: true
        type: string
      channel:
        description: "npm dist-tag"
        required: false
        default: "latest"
        type: choice
        options:
          - latest
          - dev
          - beta
      create_release:
        description: "Create a GitHub release with binary downloads"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - dev

# Change this to your npm org name (without the @)
env:
  NPM_SCOPE: ofoundation

permissions:
  contents: write
  packages: write

concurrency:
  group: fork-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - name: Determine version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "channel=${{ inputs.channel }}" >> "$GITHUB_OUTPUT"
          else
            TIMESTAMP=$(date -u +%Y%m%d%H%M)
            echo "version=0.0.0-dev-${TIMESTAMP}" >> "$GITHUB_OUTPUT"
            echo "channel=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build CLI binaries for all platforms
        run: ./packages/opencode/script/build.ts
        env:
          OPENCODE_VERSION: ${{ steps.meta.outputs.version }}
          OPENCODE_CHANNEL: ${{ steps.meta.outputs.channel }}

      - uses: actions/upload-artifact@v4
        with:
          name: opencode-cli
          path: packages/opencode/dist
          retention-days: 3

    outputs:
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: ${{ vars.NPM_REGISTRY_URL || 'https://registry.npmjs.org' }}
          scope: "@${{ env.NPM_SCOPE }}"

      - uses: actions/download-artifact@v4
        with:
          name: opencode-cli
          path: packages/opencode/dist

      - name: Verify npm auth
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - run: ./script/fork-publish.ts
        env:
          OPENCODE_VERSION: ${{ needs.build.outputs.version }}
          OPENCODE_CHANNEL: ${{ needs.build.outputs.channel }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: false
          NPM_SCOPE: ${{ env.NPM_SCOPE }}

      - name: Create release archives
        if: inputs.create_release
        working-directory: packages/opencode
        run: |
          for dir in dist/opencode-*/; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            if echo "$name" | grep -q linux; then
              tar -czf "dist/${name}.tar.gz" -C "${dir}bin" .
            else
              ( cd "${dir}bin" && zip -r "../../${name}.zip" . )
            fi
          done

      - name: Create GitHub release
        if: inputs.create_release
        run: |
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes \
            packages/opencode/dist/*.tar.gz \
            packages/opencode/dist/*.zip
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
